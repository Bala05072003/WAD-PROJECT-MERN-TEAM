<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - StepUnity</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container" style="max-width:700px; margin-top:60px;">
    <h2 class="welcome">Your Dashboard</h2>
    <div id="content" class="mt-4">
      <p>Loading...</p>
    </div>

    <button id="logoutBtn" class="btn btn-outline-dark mt-3">Logout</button>
  </div>

<script>
const BASE_URL = 'http://localhost:5000';

function getQueryParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

// prefer query param; fallback to localStorage
const userId = getQueryParam('id') || localStorage.getItem('userId');

if (!userId) {
  document.getElementById('content').innerHTML = '<p>No user id found. Please <a href="login.html">login</a>.</p>';
} else {
  fetch(`${BASE_URL}/api/users/${userId}`)
    .then(res => res.json())
    .then(data => {
      if (data.user) {
        const u = data.user;
        document.getElementById('content').innerHTML = `
          <div class="card p-3">
            <h4>Welcome, ${u.name || '(No name)'}</h4>
            <p><strong>Email:</strong> ${u.email}</p>
            <p><strong>Member since:</strong> ${new Date(u.createdAt).toLocaleString()}</p>
          </div>
        `;
        // store id for future
        localStorage.setItem('userId', u._id || u.id || userId);
      } else {
        document.getElementById('content').innerHTML = '<p>User not found.</p>';
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('content').innerHTML = '<p>Error loading user.</p>';
    });
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('userId');
  // send to login page
  window.location.href = 'login.html';
});
</script>
</body>
</html>
